plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
}

android {
    compileSdk targetV
    defaultConfig {
        minSdk minV
        targetSdk targetV
        resConfig "en"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = 11
        targetCompatibility = 11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    afterEvaluate {
        publishing {
            publications {
                release(MavenPublication) {
                    from components.release
                    groupId = 'com.github.aaaamirabbas'
                    artifactId = 'reactor'
                    version = vName
                }
            }
        }
    }
}

dependencies {
    // DataStore
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    implementation "androidx.datastore:datastore-proto:1.0.0"
    // Security for encryption
    implementation "androidx.security:security-crypto:1.0.0" // Using 1.0.0 as a stable release

    // Kotlin Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1"

    // Testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "io.mockk:mockk:1.13.5"
    androidTestImplementation "junit:junit:4.13.2" // For potential Android tests
    androidTestImplementation "io.mockk:mockk-android:1.13.5" // For potential Android tests
}